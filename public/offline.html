<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotionHR - غير متصل</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#1A1B4B 0%,#4C1D95 100%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
  .container{max-width:400px}
  .icon{font-size:80px;margin-bottom:20px}
  h1{font-size:28px;margin:0 0 12px}
  p{font-size:16px;opacity:0.9;line-height:1.6;margin:0 0 24px}
  button{background:#fff;color:#1A1B4B;border:none;padding:12px 32px;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit}
  button:hover{opacity:0.9}
</style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>غير متصل بالإنترنت</h1>
    <p>يبدو أن الإنترنت مقطوع. تحقق من اتصالك وحاول مرة أخرى.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
